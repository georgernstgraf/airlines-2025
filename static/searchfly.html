<html>
<head>
    <title>Flüge Suchen</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="abfluge.png" type="image/x-icon">
</head>
<body>
   <nav class="main-nav">
  <div class="nav-container">
    <a class="nav-logo" href="index.html">Flüge Suchen</a>
    <ul class="nav-menu">
      <li class="nav-item">
        <a class="nav-link" href="index.html">Home</a>
      </li>
      <li class="nav-item">
        <a class="nav-link nav-link--active" href="searchfly.html">Flüge suchen</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="bookfly.html">Flüge buchen</a>
      </li>
    </ul>
  </div>
</nav>

<main class="main-content">
  <section class="search-section">
    <div class="container">
      <h1>Flüge suchen</h1>
      <p>Finden Sie verfügbare Flüge zu Ihrem Wunschziel</p>
      
      <div class="search-form">
        <div class="form-row">
          <div class="form-group">
            <label for="from">Von</label>
            <input type="text" id="from" placeholder="Startflughafen">
          </div>
          <div class="form-group">
            <label for="to">Nach</label>
            <input type="text" id="to" placeholder="Zielflughafen">
          </div>
        </div>
        
        <div class="form-row">
          <div class="form-group">
            <label for="departure">Abflugdatum</label>
            <input type="date" id="departure">
          </div>
          <div class="form-group">
            <label for="return">Rückflugdatum</label>
            <input type="date" id="return">
          </div>
        </div>
        
        <div class="form-row">
          <div class="form-group">
            <label for="passengers">Passagiere</label>
            <select id="passengers">
              <option>1 Passagier</option>
              <option>2 Passagiere</option>
              <option>3 Passagiere</option>
              <option>4 Passagiere</option>
            </select>
          </div>
          <div class="form-group">
            <label for="class">Klasse</label>
            <select id="class">
              <option>Economy</option>
              <option>Premium Economy</option>
              <option>Business</option>
              <option>First Class</option>
            </select>
          </div>
        </div>
        
        <button class="btn btn-primary btn-search">Flüge suchen</button>
      </div>
    </div>
  </section>

  

<footer class="main-footer">
  <div class="container">
    <p>&copy; 2024 Flughafen. Alle Rechte vorbehalten.</p>
  </div>
</footer>
</body>
</html>
